<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Frontend Mentor | Expenses chart component</title>
    <script defer type="module" src="./js/script.js"></script>
  </head>
  <body>
    <main class="main">
      <div class="main-container">
        <div class="balance-card">
          <span class="balance-card__label"
            >My balance <span class="balance-card__amount">$921.48</span></span
          >

          <div class="balance-card__logo-box">
            <img src="./images/logo.svg" class="balance-card__logo" alt="logo" />
          </div>
        </div>

        <!-- graph -->
        <div class="spending-summary">
          <h1 class="spending-summary__header">Spending - Last 7 days</h1>

          <div class="spending-summary__chart">
            <div class="spending-summary__bar">
              <div class="spending-summary__bar-fill spending-summary__bar-fill-mon">
                <span class="spending-summary__amount">$17.45</span>
              </div>
              <span class="spending-summary__day">mon</span>
            </div>

            <div class="spending-summary__bar">
              <div class="spending-summary__bar-fill spending-summary__bar-fill-tue">
                <span class="spending-summary__amount">$34.91</span>
              </div>
              <span class="spending-summary__day">tue</span>
            </div>

            <div class="spending-summary__bar">
              <div class="spending-summary__bar-fill spending-summary__bar-fill-wed">
                <span class="spending-summary__amount">$52.36</span>
              </div>
              <span class="spending-summary__day">wed</span>
            </div>

            <div class="spending-summary__bar">
              <div class="spending-summary__bar-fill spending-summary__bar-fill-thur">
                <span class="spending-summary__amount">$31.07</span>
              </div>
              <span class="spending-summary__day">thur</span>
            </div>

            <div class="spending-summary__bar">
              <div class="spending-summary__bar-fill spending-summary__bar-fill-fri">
                <span class="spending-summary__amount">$23.39</span>
              </div>
              <span class="spending-summary__day">fri</span>
            </div>

            <div class="spending-summary__bar">
              <div class="spending-summary__bar-fill spending-summary__bar-fill-sat">
                <span class="spending-summary__amount">$43.28</span>
              </div>
              <span class="spending-summary__day">sat</span>
            </div>

            <div class="spending-summary__bar">
              <div class="spending-summary__bar-fill spending-summary__bar-fill-sun">
                <span class="spending-summary__amount">$25.48</span>
              </div>
              <span class="spending-summary__day">sun</span>
            </div>
          </div>

          <div class="spending-summary__footer">
            <span class="spending-summary__label"
              >Total this month <span class="spending-summary__total">$478.33</span></span
            >

            <span class="spending-summary__percentage">+2.4% <span>from last month</span></span>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
